<!DOCTYPE html>
<html>
<head>
    <title>Favicon Generator</title>
</head>
<body>
    <canvas id="favicon16" width="16" height="16"></canvas>
    <canvas id="favicon32" width="32" height="32"></canvas>
    <canvas id="favicon180" width="180" height="180"></canvas>
    <canvas id="favicon192" width="192" height="192"></canvas>
    <canvas id="favicon512" width="512" height="512"></canvas>
    <canvas id="favicon150" width="150" height="150"></canvas>
    
    <script>
        function drawFavicon(canvasId, size) {
            const canvas = document.getElementById(canvasId);
            const ctx = canvas.getContext('2d');
            
            // Background
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(0, 0, size, size);
            
            // Rounded corners
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, size * 0.2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
            
            // Lines
            ctx.fillStyle = 'white';
            const lineHeight = size * 0.06;
            const lineSpacing = size * 0.12;
            const startY = size * 0.25;
            
            for (let i = 0; i < 3; i++) {
                const y = startY + i * lineSpacing;
                const width = i === 2 ? size * 0.6 : size * 0.8;
                ctx.fillRect(size * 0.25, y, width, lineHeight);
            }
            
            // Circle
            ctx.fillStyle = '#3b82f6';
            ctx.beginPath();
            ctx.arc(size * 0.75, size * 0.625, size * 0.1, 0, 2 * Math.PI);
            ctx.fill();
            
            // Plus sign in circle
            ctx.fillStyle = 'white';
            const centerX = size * 0.75;
            const centerY = size * 0.625;
            const plusSize = size * 0.04;
            
            ctx.fillRect(centerX - plusSize/2, centerY - plusSize, plusSize, plusSize * 2);
            ctx.fillRect(centerX - plusSize, centerY - plusSize/2, plusSize * 2, plusSize);
        }
        
        // Draw all favicon sizes
        drawFavicon('favicon16', 16);
        drawFavicon('favicon32', 32);
        drawFavicon('favicon180', 180);
        drawFavicon('favicon192', 192);
        drawFavicon('favicon512', 512);
        drawFavicon('favicon150', 150);
        
        console.log('Favicons generated! You can now right-click on each canvas and save as PNG.');
    </script>
</body>
</html>
